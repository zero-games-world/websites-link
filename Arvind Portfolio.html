<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arvind Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#F5F6FB;--sf:#fff;--ink:#14142B;--mu:#5B5F7A;--ln:#DEE0EE;--ac:#5B3DF5;--ai:#fff;--hi:#FFC53D;--wa:#0E8F4F;--dg:#C62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F1F;--sf:#181A33;--ink:#F0F1FA;--mu:#9EA3C4;--ln:#2B2E52;--ac:#8F7BFF;--ai:#0E0F1F;--dg:#E57373;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F1F;--sf:#181A33;--ink:#F0F1FA;--mu:#9EA3C4;--ln:#2B2E52;--ac:#8F7BFF;--ai:#0E0F1F;--dg:#E57373;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "Sora",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hero{color:#fff;border-radius:0 0 40px 40px;background:radial-gradient(60% 70% at 15% 15%,rgba(140,110,255,.55),transparent 70%),radial-gradient(50% 60% at 90% 90%,rgba(255,120,170,.35),transparent 70%),linear-gradient(145deg,#190F5E,#3A22B5 60%,#5F33DB);padding-bottom:64px}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;gap:12px}
.brand{font-weight:800;font-size:20px}
.hg{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:center;padding-top:14px}
.ph{position:relative;max-width:380px;width:100%;margin:0 auto}
.ph img{display:block;width:100%;aspect-ratio:1/1.1;object-fit:cover;object-position:50% 20%;border-radius:999px 999px 28px 28px;border:6px solid rgba(255,255,255,.28);box-shadow:0 30px 60px rgba(8,4,50,.45);animation:rise .9s ease both}
.chip{position:absolute;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.c1{left:-14px;bottom:22%}.c2{right:-10px;top:30%}.c3{left:12%;bottom:-14px}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.hi{margin:0 0 6px;font-weight:600;color:var(--hi)}
h1{font-size:clamp(32px,5.2vw,54px);line-height:1.15;font-weight:800;margin:0 0 16px}
h2{font-size:clamp(26px,3.6vw,34px);margin:0 0 24px;font-weight:800}
h3{margin:0 0 6px;font-size:18px}
.hero p.t{color:rgba(255,255,255,.82);font-size:18px;max-width:30em;margin:0 0 26px}
.btn{font:inherit;font-weight:600;border:1.5px solid transparent;border-radius:12px;padding:11px 22px;cursor:pointer;background:var(--ac);color:var(--ai);text-decoration:none;display:inline-block;margin:0 8px 8px 0}
.btn.gold{background:var(--hi);color:#2A1B00}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ln)}
.btn.wa{background:var(--wa);color:#fff}
.btn.danger{background:var(--dg);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
section{padding-top:72px}
.mu{color:var(--mu)}
.frame{background:var(--sf);border:1.5px solid var(--ln);border-radius:18px;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1.5px solid var(--ln)}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--ln);flex:none}
.bar span{margin-left:8px;flex:1;min-width:0;font-size:13px;color:var(--mu);background:var(--bg);border-radius:6px;padding:1px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot{aspect-ratio:16/10;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff}
.shot.has-image{position:relative;overflow:hidden}
.shot-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.shot.has-image::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6))}
.shot.has-image b{position:relative;z-index:1;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.shot.has-image em{display:none}
.shot b{font-size:clamp(22px,3.2vw,30px);line-height:1.2;font-weight:800;margin-bottom:10px}
.shot em{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.35);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.body{padding:18px 20px 12px}
.body p{margin:0 0 12px;color:var(--mu);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags span{font-size:12px;font-weight:600;border:1.5px solid var(--ln);border-radius:999px;padding:0 10px}
.soon{font-size:14px;color:var(--mu)}
.sk{display:flex;flex-wrap:wrap;gap:12px}
.sk span{background:var(--sf);border:1.5px solid var(--ln);border-left:5px solid var(--ac);border-radius:14px;padding:10px 20px;font-weight:600}
.ct{margin-top:72px;border-radius:32px;color:#fff;text-align:center;padding:52px 24px;background:radial-gradient(60% 80% at 80% 0,rgba(255,120,170,.35),transparent 70%),linear-gradient(145deg,#190F5E,#3A22B5 65%,#5F33DB)}
.ct h2{margin-bottom:8px}.ct p{margin:0 0 20px;color:rgba(255,255,255,.82)}
.num{display:block;font-size:clamp(28px,6vw,44px);font-weight:800;color:var(--hi);text-decoration:none;margin-bottom:24px}
.foot{padding:28px 0 96px;color:var(--mu);text-align:center;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--wa);color:#fff;font-weight:600;text-decoration:none;border-radius:999px;padding:12px 20px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.6);display:flex;justify-content:flex-end;z-index:30}
.dr{background:var(--sf);color:var(--ink);width:min(460px,100%);height:100%;overflow:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px))}
.dr h3{margin:22px 0 8px}
.row,.item{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item{border-bottom:1.5px solid var(--ln);padding:8px 0;flex-wrap:wrap}
.item .btn{margin:0}
label{font-weight:600;font-size:14px}
.f{display:block;width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);margin:4px 0 14px}
@media(max-width:800px){.hg{grid-template-columns:1fr;gap:40px}.hero{border-radius:0 0 28px 28px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ph img{animation:none}}
</style>
</head>

const bar=p=>`<div class="bar"><i></i><i></i><i></i><span>${esc(p.displayUrl||p.url||'Live link coming soon')}</span></div>`;
const shot=p=>{const h=hue(p.title);return `<div class="shot${p.image?' has-image':''}" style="background:linear-gradient(135deg,hsl(${h} 55% 36%),hsl(${(h+40)%360} 60% 26%))">${p.image?`<img class="shot-image" src="${esc(p.image)}" alt="${esc(p.title)} website preview" loading="lazy">`:''}<b>${esc(p.title)}</b>${p.image?'':'<em style="width:70%"></em><em style="width:45%"></em>'}</div>`};
const card=p=>`<article class="frame">${bar(p)}${shot(p)}<div class="body"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p><div class="tags">${(p.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>${safe(p.url)?`<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Visit website</a>`:'<p class="soon">Live link coming soon</p>'}</div></article>`;
function renderSite(){
  const d=(S.phone||'').replace(/\D/g,''),num=d.length===10?'91'+d:d;
  const shown=d.length===10?'+91 '+d.slice(0,5)+' '+d.slice(5):(d?'+'+d:'');
  const wa=num?'https://wa.me/'+num+'?text='+encodeURIComponent('Hi '+S.name+', I saw your portfolio and I would like a website.'):'';
  $('site').innerHTML=`<div class="hero"><div class="wrap"><header class="top"><div class="brand">${esc(S.name)} Portfolio</div></header>
<div class="hg"><div class="ph">${S.photo?`<img src="${esc(S.photo)}" alt="${esc(S.name)}">`:''}<span class="chip c1">Responsive design</span><span class="chip c2">Python backend</span><span class="chip c3">Clean UI</span></div>
<div><p class="hi">Hi, I'm ${esc(S.name)} · ${esc(S.role)}</p><h1>I build websites that make customers trust your business.</h1><p class="t">${esc(S.tagline)}</p>${S.projects.length?`<a class="btn gold" href="#work">View my work</a>`:''}${wa?`<a class="btn ghost" href="${wa}" target="_blank" rel="noopener">Chat on WhatsApp</a>`:''}</div></div></div></div>
<div class="wrap">${S.projects.length?`<section id="work"><h2>My Built Websites</h2><div class="grid">${S.projects.map(card).join('')}</div></section>`:''}
<section><h2>My Skills</h2><p class="mu" style="max-width:34em;margin:0 0 20px">${esc(S.skillsIntro||"Tools I work with to design, build and ship websites.")}</p><div class="sk">${(S.skills||[]).map(s=>`<span>${esc(s)}</span>`).join("")}</div></section>
<div class="ct" id="contact"><h2>Let's build your website</h2><p>Call or message me on WhatsApp.</p>${shown?`<a class="num" href="tel:+${num}">${esc(shown)}</a>`:''}${wa?`<a class="btn wa" href="${wa}" target="_blank" rel="noopener">Chat on WhatsApp</a>`:''}</div>
<footer class="foot">© ${new Date().getFullYear()} ${esc(S.name)} Portfolio</footer></div>${wa?`<a class="fab" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:''}`;
}
renderSite();
</script></body></html>
